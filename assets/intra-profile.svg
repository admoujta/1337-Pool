<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263e55"/>
      <stop offset="0.48" stop-color="#214b4d"/>
      <stop offset="1" stop-color="#25364b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171d26" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#202630" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16cbd6"/>
      <stop offset="1" stop-color="#10b6c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="avatar"><circle cx="175" cy="305" r="112"/></clipPath>
  </defs>

  <rect width="1600" height="600" rx="28" fill="url(#bg)"/>
  <polygon points="0,0 320,0 200,160 0,110" fill="#32456b" opacity=".40"/>
  <polygon points="210,0 610,0 500,150 330,120" fill="#2d3f68" opacity=".38"/>
  <polygon points="520,0 980,0 860,130 640,155" fill="#2a625c" opacity=".27"/>
  <polygon points="960,0 1600,0 1600,150 1200,95" fill="#2d3d61" opacity=".38"/>
  <polygon points="0,150 350,230 170,470 0,420" fill="#214961" opacity=".32"/>
  <polygon points="250,160 720,260 610,520 330,430" fill="#2c4b5c" opacity=".22"/>
  <polygon points="690,160 1180,185 1070,545 790,520" fill="#233b43" opacity=".30"/>
  <polygon points="1130,140 1600,210 1600,600 1260,520" fill="#304249" opacity=".24"/>

  <text x="350" y="58" fill="#ffffff" font-size="44" font-family="Arial,Helvetica,sans-serif" font-weight="700">Adam Moujtahid</text>
  <text x="705" y="58" fill="#eef2f5" font-size="30" font-family="Arial,Helvetica,sans-serif">admoujta</text>

  <circle cx="175" cy="305" r="118" fill="#edf1f4"/>
  <image href="https://raw.githubusercontent.com/admoujta/1337-Pool/main/assets/adam-moujtahid.jpg" x="63" y="193" width="224" height="224" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)"/>
  <circle cx="175" cy="305" r="114" fill="none" stroke="#ffffff" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="350" y="95" width="1180" height="130" rx="18" fill="url(#panel)"/>
    <rect x="350" y="255" width="1180" height="210" rx="18" fill="url(#panel)"/>
    <rect x="350" y="500" width="1180" height="62" rx="16" fill="url(#panel)"/>
  </g>

  <text x="505" y="145" text-anchor="middle" fill="#16cbd6" font-size="28" font-family="Arial,Helvetica,sans-serif">Evaluation Points</text>
  <text x="505" y="194" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">5</text>

  <text x="815" y="145" text-anchor="middle" fill="#16cbd6" font-size="28" font-family="Arial,Helvetica,sans-serif">Cursus</text>
  <text x="815" y="194" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">C Piscine</text>

  <text x="1120" y="145" text-anchor="middle" fill="#16cbd6" font-size="28" font-family="Arial,Helvetica,sans-serif">Grade</text>
  <text x="1120" y="194" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">Pisciner</text>

  <text x="1410" y="145" text-anchor="middle" fill="#16cbd6" font-size="28" font-family="Arial,Helvetica,sans-serif">Level</text>
  <text x="1410" y="194" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700">9 — 36%</text>

  <text x="940" y="345" text-anchor="middle" fill="#ffffff" font-size="56" font-family="Arial,Helvetica,sans-serif" font-weight="700">C Piscine</text>
  <text x="940" y="395" text-anchor="middle" fill="#b8c2cd" font-size="24" font-family="Arial,Helvetica,sans-serif">1337 • 42 Network</text>

  <rect x="380" y="518" width="1120" height="28" rx="10" fill="#282f39"/>
  <rect x="380" y="518" width="403" height="28" rx="10" fill="url(#bar)"/>
  <text x="940" y="541" text-anchor="middle" fill="#ffffff" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="600">Level 9 — 36%</text>
</svg>