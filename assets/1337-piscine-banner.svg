<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">1337 Piscine — 42 Network</title>
  <desc id="desc">A dark developer banner for Adam Moujtahid's 1337 Piscine repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00babc"/>
      <stop offset="1" stop-color="#39e6d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="55" r="180" fill="#00babc" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1120" cy="300" r="220" fill="#39e6d4" opacity="0.07" filter="url(#glow)"/>
  <path d="M0 310 C240 230 420 390 650 300 C850 220 1040 250 1200 180 L1200 360 L0 360 Z" fill="#00babc" opacity="0.06"/>

  <rect x="70" y="64" width="158" height="38" rx="19" fill="#00babc" opacity="0.14" stroke="#00babc" stroke-opacity="0.55"/>
  <text x="149" y="89" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#66fff1">42 NETWORK</text>

  <text x="70" y="166" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff">1337 Piscine</text>
  <text x="70" y="212" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500" fill="#b8c4d8">C • Shell • Unix • Git • Algorithms • Problem Solving</text>

  <rect x="70" y="256" width="1060" height="1" fill="#ffffff" opacity="0.10"/>
  <text x="70" y="307" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#ffffff">Adam Moujtahid</text>
  <text x="245" y="307" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#00d7d9">@admoujta</text>
  <text x="1130" y="307" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="18" fill="#8fa1ba">Piscine 2026</text>
</svg>